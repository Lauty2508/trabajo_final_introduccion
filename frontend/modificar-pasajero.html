                    <a role="button" class="navbar-burger" data-target="navMenu" aria-label="menu" aria-expanded="false">
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span></a>
        </div>
        <div class="navbar-menu " id="navMenu">
            <div class="navbar-end">
                <a class="navbar-item" href="index.html">

        </div>
    </nav>
    <div class="content">
        <a class="button is-warning mt-4 ml-3 is-dark" href="pasajero.html">Volver</a>
    </div>
    <div class="content has-text-centered my-6">
        <h1 class="is-underlined">Modificar pasajero</h1>
    </div>
    <div class="container">
        <table class="table is-fullwidth">
            <tbody>
                <tr>
                    <td>ID</td>
                    <td id="pasajero-id"></td>
                </tr>
                <tr>
                    <td>Documento</td>
                    <td id="pasajero-documento"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-documento', this)">Modificar</button>
                    </td>
                </tr>
                <tr>
                    <td>Nombre</td>
                    <td id="pasajero-nombre"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-nombre', this)">Modificar</button>
                    </td>
                </tr>
                <tr>
                    <td>Apellido</td>
                    <td id="pasajero-apellido"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-apellido', this)">Modificar</button>
                    </td>
                </tr>
                <tr>
                    <td>Edad</td>
                    <td id="pasajero-edad"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-edad', this)">Modificar</button>
                    </td>
                </tr>
                <tr>
                    <td>Teléfono</td>
                    <td id="pasajero-telefono"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-telefono', this)">Modificar</button>
                    </td>
                </tr>
                <tr>
                    <td>Estado de salud</td>
                    <td id="pasajero-estado"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-estado', this)">Modificar</button>
                    </td>
                </tr>
                <tr>
                    <td>Dirección</td>
                    <td id="pasajero-direccion"></td>
                    <td>
                        <button class="button is-info" onclick="habilitarEdicion('pasajero-direccion', this)">Modificar</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="content has-text-right mb-5 mr-3"> 
            <button onclick="actualizarPasajero();" class="button is-success is-dark">Guardar</button>
        </div>
    </div>
    <script>obtenerPasajero();</script>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {

  // Obtiene todos los navbar-items
  const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

  // Le agrega el evento de click a cada uno de ellos
  $navbarBurgers.forEach( el => {
    el.addEventListener('click', () => {

      // Obtiene el target del atributo data-target
      const target = el.dataset.target;
      const $target = document.getElementById(target);

      // Activa es is-active en navbar-burger y navbar-menu 
      el.classList.toggle('is-active');
      $target.classList.toggle('is-active');

    });
  });

});
</script>
</html>
