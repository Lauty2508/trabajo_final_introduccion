<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobAL - Naves</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../assets/logo.png" alt="GlobAL Space Travel Company">
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="naves.html" class="activo-link">Naves</a>
            <a href="plataformas.html">Plataformas</a>
            <a href="pasajeros.html">Pasajeros</a>
            <a href="viajes.html">Viajes</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    <main class="contenedor-gestion">

        <section class="encabezado-pagina">
            <div>
                <p class="etiqueta">GESTIÓN DE FLOTA</p>
                <h2>Naves Espaciales</h2>
            </div>

            <button class="boton-principal">+ Nueva Nave</button>
        </section>

        <section class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre / Matrícula</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#NV-01</td>
                        <td><strong>Astraea I</strong></td>
                        <td>45 pasajeros</td>
                        <td><span class="estado disponible-texto">ACTIVA</span></td>
                        <td>
                            <button class="boton-tabla">Editar</button>
                        </td>
                    </tr>
                    <tr>
                        <td>#NV-02</td>
                        <td><strong>Hyperion X</strong></td>
                        <td>60 pasajeros</td>
                        <td><span class="estado mantenimiento-texto">MANTENIMIENTO</span></td>
                        <td>
                            <button class="boton-tabla">Editar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>

</html>
