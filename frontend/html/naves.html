<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobAL - Naves</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../assets/logo.png" alt="GlobAL Space Travel Company">
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="naves.html" class="activo-link">Naves</a>
            <a href="plataformas.html">Plataformas</a>
            <a href="pasajeros.html">Pasajeros</a>
            <a href="viajes.html">Viajes</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    <main class="contenedor-gestion">

        <section class="encabezado-pagina">
            <div>
                <p class="etiqueta">GESTIÓN DE FLOTA</p>
                <h2>Naves Espaciales</h2>
            </div>

            <button id="btn-nueva-nave" class="boton-principal">
                + Nueva Nave
            </button>
        </section>
        
        <section id="formulario-nave" class="formulario-contenedor">

            <form id="form-nave">

                <h3 id="titulo-formulario">Nueva Nave</h3>

                <label for="modelo" class="titulo-modal">Modelo</label>
                <input type="text" id="modelo" placeholder="Modelo" required>

                <label for="tiempo" class="titulo-modal">Tiempo de uso</label>
                <input type="number" id="tiempo" placeholder="Tiempo de uso" required>

                <label for="anio" class="titulo-modal">Año de fabricación</label>
                <input type="number" id="anio" placeholder="Año de fabricación" required>

                <label for="kilometraje" class="titulo-modal">Kilometraje recorrido</label>
                <input type="number" id="kilometraje" placeholder="Kilometraje recorrido" required>

                <label for="capacidad" class="titulo-modal">Capacidad máxima de pasajeros</label>
                <input type="number" id="capacidad" placeholder="Capacidad máxima de pasajeros" required>

                <label for="estado" class="titulo-modal">Estado de la nave</label>
                <select id="estado">
                    <option value="Operativa">Operativa</option>
                    <option value="En mantenimiento">En mantenimiento</option>
                    <option value="En revision tecnica">En revisión técnica</option>
                    <option value="Fuera de servicio">Fuera de servicio</option>
                </select>

                <div class="botones-formulario">
                    <button type="button" id="btn-cancelar" class="boton-tabla">
                        Cancelar
                    </button>

                    <button type="submit" class="boton-principal">
                        Guardar
                    </button>
                </div>

            </form>

        </section>

        <section class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-naves">
                    <tr>
                        <td>#NV-01</td>
                        <td><strong>Astraea I</strong></td>
                        <td>45 pasajeros</td>
                        <td><span class="estado disponible-texto">ACTIVA</span></td>
                        <td>
                            <button class="boton-tabla">Editar</button>
                        </td>
                    </tr>
                    <tr>
                        <td>#NV-02</td>
                        <td><strong>Hyperion X</strong></td>
                        <td>60 pasajeros</td>
                        <td><span class="estado mantenimiento-texto">MANTENIMIENTO</span></td>
                        <td>
                            <button class="boton-tabla">Editar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>
    <script src="../js/naves.js"></script>
</body>

</html>
