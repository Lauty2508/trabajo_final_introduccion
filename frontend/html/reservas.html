<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobAL - Reservas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../assets/logo.png" alt="GlobAL Space Travel Company">
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="naves.html">Naves</a>
            <a href="plataformas.html">Plataformas</a>
            <a href="pasajeros.html">Pasajeros</a>
            <a href="viajes.html">Viajes</a>
            <a href="reservas.html" class="activo-link">Reservas</a>
        </nav>
    </header>

    <main class="contenedor-gestion">

        <section class="encabezado-pagina">
            <div>
                <p class="etiqueta">GESTIÓN DE PASAJES</p>
                <h2>Reservas de Vuelo</h2>
            </div>

            <button id="btn-nueva-reserva" class="boton-principal">+ Nueva Reserva</button>
        </section>
        <section id="formulario-reserva" class="formulario-contenedor">

            <form id="form-reserva">

                <h3 id="titulo-formulario">
                    Nueva Reserva
                </h3>

                <input
                    type="text"
                    id="codigo_asiento"
                    placeholder="Código de asiento"
                    required>

                <input
                    type="date"
                    id="fecha_reserva"
                    required>

                <input
                    type="number"
                    id="precio_pasaje"
                    placeholder="Precio del pasaje"
                    step="0.01"
                    required>

                <label>Viaje</label>

                <select id="vuelo" required>

                    <option value="">
                        Seleccione un viaje
                    </option>

                </select>
                
                <label>Pasajero</label>

                    <select id="pasajero" required>

                        <option value="">
                            Seleccione un pasajero
                        </option>

                    </select>

                <div class="botones-formulario">

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="boton-tabla">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="boton-principal">

                        Guardar

                    </button>

                </div>

            </form>

        </section>

        <section class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Código Reserva</th>
                        <th>Pasajero</th>
                        <th>Vuelo</th>
                        <th>Asiento</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas"></tbody>
            </table>
        </section>

    </main>
    <script src="../js/reservas.js"></script>
</body>

</html>
