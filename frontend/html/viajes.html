<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobAL - Viajes</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../assets/logo.png" alt="GlobAL Space Travel Company">
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="naves.html">Naves</a>
            <a href="plataformas.html">Plataformas</a>
            <a href="pasajeros.html">Pasajeros</a>
            <a href="viajes.html" class="activo-link">Viajes</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    <main class="contenedor-gestion">

        <section class="encabezado-pagina">
            <div>
                <p class="etiqueta">PROGRAMACIÓN DE VUELOS</p>
                <h2>Viajes Suborbitales</h2>
            </div>

            <button id="btn-nuevo-viaje"class="boton-principal">+ Programar Viaje</button>
        </section>
        
        <section id="formulario-viaje" class="formulario-contenedor">

            <form id="form-viaje">

                <h3 id="titulo-formulario">
                    Nuevo Viaje
                </h3>

                <input
                    type="date"
                    id="fecha"
                    required>

                <input
                    type="time"
                    id="horario"
                    required>

                <input
                    type="number"
                    id="duracion"
                    placeholder="Duración (minutos)"
                    required>

                <select id="estado">

                    <option value="Programado">Programado</option>

                    <option value="Preparación">Preparación</option>

                    <option value="Autorizado">Autorizado</option>

                </select>

                <input
                    type="number"
                    id="plataforma_origen"
                    placeholder="ID Plataforma origen"
                    required>

                <input
                    type="number"
                    id="plataforma_destino"
                    placeholder="ID Plataforma destino"
                    required>

                <input
                    type="number"
                    id="nave"
                    placeholder="ID Nave"
                    required>

                <div class="botones-formulario">

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="boton-tabla">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="boton-principal">

                        Guardar

                    </button>

                </div>

            </form>

        </section>

        <section class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Origen → Destino</th>
                        <th>Nave</th>
                        <th>Fecha y Hora</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-viajes"></tbody>
            </table>
        </section>

    </main>
    <script src="../js/viajes.js"></script>
</body>

</html>
