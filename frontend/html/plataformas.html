<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobAL - Plataformas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../assets/logo.png" alt="GlobAL Space Travel Company">
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="naves.html">Naves</a>
            <a href="plataformas.html" class="activo-link">Plataformas</a>
            <a href="pasajeros.html">Pasajeros</a>
            <a href="viajes.html">Viajes</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    <main class="contenedor-gestion">

        <section class="encabezado-pagina">
            <div>
                <p class="etiqueta">INFRAESTRUCTURA OPERATIVA</p>
                <h2>Plataformas de Lanzamiento</h2>
            </div>

            <button id="btn-nueva-plataforma"class="boton-principal">+ Nueva Plataforma</button>
        </section>
        <section id="formulario-plataforma" class="formulario-contenedor">

            <form id="form-plataforma">

                <h3 id="titulo-formulario">
                    Nueva Plataforma
                </h3>

                <label for="pais" class="titulo-modal">País</label>
                <input
                    type="text"
                    id="pais"
                    placeholder="País"
                    required>

                <label for="latitud" class="titulo-modal">Latitud</label>
                <input
                    type="number"
                    id="latitud"
                    placeholder="Latitud"
                    step="any"
                    required>

                <label for="longitud" class="titulo-modal">Longitud</label>
                <input
                    type="number"
                    id="longitud"
                    placeholder="Longitud"
                    step="any"
                    required>

                <label for="capacidad" class="titulo-modal">Capacidad máxima de naves</label>
                <input
                    type="number"
                    id="capacidad"
                    placeholder="Capacidad máxima de naves"
                    required>

                <label for="estado" class="titulo-modal">Estado de la plataforma</label>
                <select id="estado">

                    <option value="Operativa">Operativa</option>

                    <option value="En mantenimiento">
                        En mantenimiento
                    </option>

                    <option value="Fuera de servicio">
                        Fuera de servicio
                    </option>

                </select>

                <div class="botones-formulario">

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="boton-tabla">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="boton-principal">

                        Guardar

                    </button>

                </div>

            </form>

        </section>
        <section class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>País</th>
                        <th>Ubicación</th>
                        <th>Capacidad Simultánea</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-plataformas"></tbody>
            </table>
        </section>

    </main>
    <script src="../js/plataformas.js"></script>
</body>

</html>
